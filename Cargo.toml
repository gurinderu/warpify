[workspace]
resolver = "2"
members = ["crates/proto", "crates/session", "crates/client", "crates/telemetry", "crates/install", "bin/plugin", "bin/cli"]
default-members = ["crates/proto", "crates/session", "crates/client", "crates/telemetry", "crates/install", "bin/cli"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
directories = "6"
kdl = "4.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "std"] }
ureq = "3"
warpify-client = { path = "crates/client" }
warpify-install = { path = "crates/install" }
warpify-proto = { path = "crates/proto" }
warpify-session = { path = "crates/session" }
warpify-telemetry = { path = "crates/telemetry" }
zellij-utils = "=0.45.1"

[profile.release]
opt-level = "s"
lto = true
strip = true

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
